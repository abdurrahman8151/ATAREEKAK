worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;
upstream laravel_nodes {
    least_conn;
    server app1:8000 max_fails=0;
    server app2:8000 max_fails=0;
    server app3:8000 max_fails=0;
    server app4:8000 max_fails=0;
    server app5:8000 max_fails=0;
    keepalive 32;
}
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;
        proxy_read_timeout 75s;

        # Serve uploaded files straight from the shared storage volume.
        # Reads must not depend on which app node the load balancer picks,
        # and this keeps static files off the Octane workers entirely.
        location /storage/ {
            alias /var/www/html/storage/app/public/;
            try_files $uri =404;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass         http://laravel_nodes;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         X-Upstream-Addr   $upstream_addr always;
        }
    }
}
