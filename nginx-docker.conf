worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;
upstream laravel_nodes {
    least_conn;
    server app1:8000 max_fails=0;
    server app2:8000 max_fails=0;
    server app3:8000 max_fails=0;
    server app4:8000 max_fails=0;
    server app5:8000 max_fails=0;
    keepalive 32;
}
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;
        proxy_read_timeout 75s;

        location / {
            proxy_pass         http://laravel_nodes;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # RV-05: was $proxy_add_x_forwarded_for, which APPENDS whatever the
            # client sent. Laravel reads the left-most entry, so once
            # TRUSTED_PROXIES is set that would let any client pick its own
            # rate-limit bucket / logged IP by sending its own X-Forwarded-For.
            # $remote_addr overwrites the header with the address nginx actually
            # observed, so the value the app trusts cannot be client-supplied.
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # RV-06: X-Upstream-Addr used to be added to EVERY response here,
            # disclosing the internal container address of whichever replica
            # answered (cluster-enumeration assist, same class as the removed
            # GET /api/health). Removed; nothing consumes it.
        }
    }
}
