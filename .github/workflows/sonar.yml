name: SonarQube Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: 4th_year_project_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xdebug
          coverage: xdebug

      - name: Create .env file
        run: |
          echo "APP_NAME=Laravel" > .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=4th_year_project_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=" >> .env
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          # T3-11: previously a fixed JWT secret literal was committed into this
          # workflow. The CI database is ephemeral and no token crosses runs, so
          # a fresh random secret per run is both sufficient and non-disclosing.
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "JWT_TTL=600" >> .env
          echo "OTP_BYPASS_ENABLED=true" >> .env
          echo "WALLET_OTP_MODE=testing" >> .env
          echo "FIREBASE_CREDENTIALS=" >> .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests with coverage
        env:
          XDEBUG_MODE: coverage
          # RV-18: DB_CONNECTION=mysql must be set at the PROCESS level, not only in
          # .env. phpunit.xml pins DB_CONNECTION=sqlite via <env> WITHOUT force, so
          # PHPUnit honours an already-set variable and does not overwrite it -- and
          # Laravel's Dotenv repository is immutable, so .env cannot win either. Without
          # these, CI provisions MySQL but every test runs on sqlite and every money/geo
          # suite silently skips while the job reports green (V6). Proven by construction:
          # a pre-set process DB_CONNECTION is what all local MySQL runs rely on.
          CI_REQUIRE_MYSQL: '1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: 4th_year_project_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        # T3-11: the trailing `|| true` made this step succeed even when tests
        # failed, so the whole CI signal (including Sonar coverage) came from a
        # run whose failures were discarded. No gate existed.
        run: php artisan test --coverage-clover=coverage.xml

      - name: SonarQube Scan
        # T3-11: was @master — a moving ref is a supply-chain risk (any push to
        # the upstream default branch executes in CI here). Pinned to v8.2.2.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # RV-37 (BACKLOG sec 4: "Order independence demonstrated across at least three
      # different --order-by=random seeds with the seed printed in the CI log, plus
      # the CI job running the suite twice"). The run above is the DEFAULT order that
      # produces the coverage artifact; this re-runs the same suite under a RANDOM
      # order with the seed echoed into the log, so an order-dependence regression (a
      # test whose result depends on what ran before it) fails the job instead of
      # hiding behind a lucky default order. Placed AFTER the scan on purpose: a step
      # that fails stops the ones after it, and this one must not be able to suppress
      # the coverage upload. No `|| true` (T3-11 removed that masking pattern) and no
      # `if: always()`, so a failure here is a real red job.
      - name: Order-independence run (random order)
        env:
          XDEBUG_MODE: 'off'
          CI_REQUIRE_MYSQL: '1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: 4th_year_project_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          SEED=$(date +%s)
          echo "random-order-seed=$SEED"
          php vendor/bin/phpunit --order-by=random --random-order-seed="$SEED" --no-coverage
