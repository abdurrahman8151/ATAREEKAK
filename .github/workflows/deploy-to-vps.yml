name: Deploy to VPS (DEPRECATED - manual only)

# ─────────────────────────────────────────────────────────────────────────────────────
# DEPRECATED as of 2026-10-03 (decision 7, owner ruling: "we moved to Render to save the cost
# of the subscription" - Option B, Render).
#
# This workflow is NOT deleted, only disarmed. Two reasons:
#   1. AGENTS.md requires the owner to approve deleting code, and "becomes obsolete" is not the
#      same instruction as "delete it";
#   2. the deploy rollback story stays available if a Render rollback is ever needed.
#
# The push trigger on branch `samer` is REMOVED, so this can no longer fire on its own. It runs
# only when someone explicitly dispatches it.
#
# THE REPLACEMENT is `render.yaml` (Render Blueprint) at the repository root, which defines the
# web service, the Horizon queue worker and the scheduler. Render deploys from the same branch on
# push; migrations run from `docker/start.sh` exactly as this workflow ran them by hand.
# ─────────────────────────────────────────────────────────────────────────────────────

on:
  # Push trigger deliberately removed - see the deprecation note above.
  workflow_dispatch:

concurrency:
  group: deploy-samer
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy latest code
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.REMOTE_PATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH,GITHUB_TOKEN
          command_timeout: 30m
          script: |
            set -eu

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "REMOTE_PATH secret is required." >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH"

            # Authenticate Git using the GITHUB_TOKEN
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            git fetch origin samer
            git reset --hard origin/samer
            git clean -fd

            echo "Checking Docker..."
            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::Docker is not installed on the VPS."
              exit 1
            fi

            echo "Starting Docker Compose build and deployment..."
            # Build and start containers in detached mode
            docker compose up -d --build

            echo "Running migrations inside the container..."
            docker compose exec -T app php artisan migrate --force

            echo "Optimizing Laravel..."
            docker compose exec -T app php artisan optimize

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment finished successfully!"


