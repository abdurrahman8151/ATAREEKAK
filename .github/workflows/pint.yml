name: Style (Pint)

# AF-2' (app-future audit): the whole tree was made Pint-compliant in one
# style-only sweep (392 files, semantics-preserving per Laravel's preset), and
# this gate keeps it that way. It runs on every branch/PR so the audit branch
# itself is gated, not just main.

on:
  push:
    branches: [ main, Agentic ]
  pull_request:

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql

      - name: Install dependencies
        # CI could not run at all before this. `composer install` runs
        # `artisan package:discover` via post-autoload-dump, which BOOTS the app, and a
        # style-only job has no .env: the JWT boot guard threw "JWT_SECRET must be set to
        # at least 32 bytes" (APP_ENV defaults to production with no .env), and once
        # APP_ENV=testing was supplied the next boot requirement failed instead -
        # `Pusher\Pusher::__construct(): Argument #1 ($auth_key) must be of type string,
        # null given`, because config/broadcasting.php defaults to pusher. The same
        # failure predates this audit on every commit (26fbdb3, c92e1e2, eaa7f14).
        #
        # Pinning one env key at a time is the wrong fix: this job only needs
        # vendor/bin/pint, so `--no-scripts` skips the application boot entirely and
        # removes the whole class of boot-time coupling. Nothing here needs the package
        # manifest, and the JWT guard stays armed for anything that does boot.
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Check formatting (no writes)
        run: vendor/bin/pint --test
