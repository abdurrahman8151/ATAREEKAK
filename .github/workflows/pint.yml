name: Style (Pint)

# AF-2' (app-future audit): the whole tree was made Pint-compliant in one
# style-only sweep (392 files, semantics-preserving per Laravel's preset), and
# this gate keeps it that way. It runs on every branch/PR so the audit branch
# itself is gated, not just main.

on:
  push:
    branches: [ main, Agentic ]
  pull_request:

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql

      - name: Install dependencies
        # CI could not run at all before this: `composer install` triggers
        # `artisan package:discover`, which BOOTS the app, and with no .env in this
        # workflow APP_ENV defaults to 'production', so the boot guard added for the
        # JWT work (AppServiceProvider::guardJwtSecret) throws "JWT_SECRET must be set
        # to at least 32 bytes" and the job dies before Pint ever runs. Same failure on
        # every commit (observed at 26fbdb3, c92e1e2, eaa7f14). APP_ENV=testing states
        # what this job is; the guard stays armed for real deployments, and a dummy
        # secret is supplied so the step is not sensitive to that choice.
        env:
          APP_ENV: testing
          JWT_SECRET: ci-no-real-secret-0123456789abcdef0123456789
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check formatting (no writes)
        run: vendor/bin/pint --test
