services:

    app1:
        build:
            context: .
            dockerfile: Dockerfile
        image: syride_octane:latest
        container_name: syride_app1
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "secret"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
            - ./storage/app/public:/var/www/html/storage/app/public
            - ./app:/var/www/html/app
            - ./database:/var/www/html/database
            - ./config:/var/www/html/config
            - ./routes:/var/www/html/routes
            - ./phpunit.xml:/var/www/html/phpunit.xml
        command: >
            sh -c "php artisan octane:start
            --server=roadrunner
            --host=0.0.0.0
            --port=8000
            --workers=16
            --max-requests=1000"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    app2:
        image: syride_octane:latest
        container_name: syride_app2
        restart: unless-stopped
