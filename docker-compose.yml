    app5:
        image: syride_octane:latest
        container_name: syride_app5
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "secret"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
