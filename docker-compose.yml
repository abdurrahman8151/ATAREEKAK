# ============================================================
# SyRide — PRODUCTION compose.
#
# This file is production-shaped and is what the deploy workflow uses:
#   docker compose up -d --build
#
# Two rules it enforces:
#   1. No credentials are written here. Every secret is injected from the
#      environment and the `${VAR:?message}` form makes compose HARD-FAIL when
#      the value is missing rather than silently falling back to a known
#      default. `${VAR:-default}` is deliberately not used anywhere.
#   2. Only ./storage/logs is bind-mounted. The application source tree is NOT
#      mounted over the image, so the container runs the artifact that
#      Dockerfile built (COPY . . at Dockerfile:72).
#
# Local development that wants the host source tree mounted, or phpMyAdmin,
# must opt in explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ============================================================

services:

    app1:
        build:
            context: .
            dockerfile: Dockerfile
        image: syride_octane:latest
        container_name: syride_app1
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set - see .env.example}"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
        command: >
            sh -c "php artisan octane:start
            --server=roadrunner
            --host=0.0.0.0
            --port=8000
            --workers=16
            --max-requests=1000"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    app2:
        image: syride_octane:latest
        container_name: syride_app2
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set - see .env.example}"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
        command: >
            sh -c "php artisan octane:start
            --server=roadrunner
            --host=0.0.0.0
            --port=8000
            --workers=16
            --max-requests=1000"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    app3:
        image: syride_octane:latest
        container_name: syride_app3
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set - see .env.example}"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
        command: >
            sh -c "php artisan octane:start
            --server=roadrunner
            --host=0.0.0.0
            --port=8000
            --workers=16
            --max-requests=1000"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    app4:
        image: syride_octane:latest
        container_name: syride_app4
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set - see .env.example}"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
        command: >
            sh -c "php artisan octane:start
            --server=roadrunner
            --host=0.0.0.0
            --port=8000
            --workers=16
            --max-requests=1000"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    app5:
        image: syride_octane:latest
        container_name: syride_app5
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set - see .env.example}"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
        command: >
            sh -c "php artisan octane:start
            --server=roadrunner
            --host=0.0.0.0
            --port=8000
            --workers=16
            --max-requests=1000"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    # Reverse proxy. Published on loopback only - the public entry point is
    # expected to be a TLS terminator in front of this host.
    nginx:
        image: nginx:alpine
        container_name: syride_nginx
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - ./nginx-docker.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - app1
            - app2
            - app3
            - app4
            - app5
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: syride_redis
        restart: unless-stopped

    # No published port: reachable only from the compose network.
    mysql:
        image: mysql:8.0
        container_name: syride_mysql
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set - see .env.example}"
            MYSQL_DATABASE: "${DB_DATABASE:-4th_year_project_db}"
            # MYSQL_PWD lets the healthcheck authenticate without putting the
            # password on the command line (where it would show up in ps).
            MYSQL_PWD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set - see .env.example}"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/primary.cnf:/etc/mysql/conf.d/primary.cnf
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
            interval: 5s
            timeout: 5s
            retries: 15
        restart: unless-stopped

    # No published port: reachable only from the compose network.
    mysql_replica:
        image: mysql:8.0
        container_name: syride_mysql_replica
        command: >
            --server-id=2
            --relay-log=relay-bin
            --read-only=1
            --skip-slave-start=OFF
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set - see .env.example}"
            MYSQL_PWD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set - see .env.example}"
        volumes:
            # No persistent volume — replica always resyncs from primary on recreate.
            # On plain restarts the container layer retains data and slave auto-resumes.
            - ./docker/mysql/replica-init.sh:/docker-entrypoint-initdb.d/01-replica-init.sh:ro
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    # phpMyAdmin is intentionally NOT defined here. It is an interactive SQL
    # console; it belongs in docker-compose.dev.yml, bound to loopback.

    queue:
        image: syride_octane:latest
        container_name: syride_queue
        command: php artisan horizon
        env_file: .env
        environment:
            APP_ENV: production
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set - see .env.example}"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped

    scheduler:
        image: syride_octane:latest
        container_name: syride_scheduler
        command: >
            sh -c "while true;
                   do php artisan schedule:run --verbose --no-interaction &
                   sleep 60;
                   done"
        env_file: .env
        environment:
            APP_ENV: production
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set - see .env.example}"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped

volumes:
    mysql_data: