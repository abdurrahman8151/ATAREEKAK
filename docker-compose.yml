            --workers=16
            --max-requests=1000"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    nginx:
        image: nginx:alpine
        container_name: syride_nginx
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - ./nginx-docker.conf:/etc/nginx/nginx.conf:ro
            - ./storage/app/public:/var/www/html/storage/app/public:ro
        depends_on:
            - app1
            - app2
            - app3
            - app4
            - app5
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: syride_redis
        restart: unless-stopped

    mysql:
        image: mysql:8.0
        container_name: syride_mysql
        environment:
            MYSQL_ROOT_PASSWORD: "secret"
            MYSQL_DATABASE: "4th_year_project_db"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/primary.cnf:/etc/mysql/conf.d/primary.cnf
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
            interval: 5s
            timeout: 5s
            retries: 15
        restart: unless-stopped

    mysql_replica:
        image: mysql:8.0
        container_name: syride_mysql_replica
        command: >
            --server-id=2
            --relay-log=relay-bin
            --read-only=1
            --skip-slave-start=OFF
        environment:
            MYSQL_ROOT_PASSWORD: "secret"
        volumes:
            # No persistent volume — replica always resyncs from primary on recreate.
            # On plain restarts the container layer retains data and slave auto-resumes.
            - ./docker/mysql/replica-init.sh:/docker-entrypoint-initdb.d/01-replica-init.sh:ro
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: syride_phpmyadmin
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: "secret"
            UPLOAD_LIMIT: 100M
        depends_on:
            mysql:
                condition: service_healthy

    queue:
        image: syride_octane:latest
        container_name: syride_queue
        command: php artisan queue:work --tries=3 --timeout=60 --sleep=3
        env_file: .env
        environment:
            APP_ENV: production
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "secret"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
            - ./storage/app/public:/var/www/html/storage/app/public
            - ./app:/var/www/html/app
            - ./config:/var/www/html/config
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped

    scheduler:
        image: syride_octane:latest
        container_name: syride_scheduler
        command: >
            sh -c "while true;
                   do php artisan schedule:run --verbose --no-interaction &
                   sleep 60;
                   done"
        env_file: .env
        environment:
            APP_ENV: production
            DB_HOST: mysql
            DB_REPLICA_HOST: mysql_replica
            DB_PASSWORD: "secret"
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
        volumes:
            - ./storage/logs:/var/www/html/storage/logs
            - ./app:/var/www/html/app
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped

volumes:
    mysql_data:
